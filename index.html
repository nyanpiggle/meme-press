<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Meme Press</title>
  <meta name="theme-color" content="#12110e" />
  <meta name="description" content="Caption it. Drag it. Download it. A classic meme studio in the browser." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">M</div>
        <div class="brand-copy">
          <h1>MEME PRESS</h1>
          <p>Classic captions. Instant download.</p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="btn" id="resetBtn" title="Reset captions and style">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Reset</span>
        </button>
        <button type="button" class="btn btn-primary" id="downloadBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          <span>Download</span>
        </button>
      </div>
    </header>

    <aside class="rail">
      <section class="panel">
        <div class="panel-head">
          <h2>Image</h2>
          <button type="button" class="btn btn-ghost" id="uploadBtn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
            Upload
          </button>
          <input id="fileInput" type="file" accept="image/*" hidden />
        </div>
        <div class="thumbs" id="thumbs" role="list"></div>
      </section>

      <section class="panel">
        <h2>Captions</h2>
        <label class="field">
          <span>Top text</span>
          <textarea id="topText" rows="2" maxlength="180" autocomplete="off"></textarea>
        </label>
        <label class="field">
          <span>Bottom text</span>
          <textarea id="bottomText" rows="2" maxlength="180" autocomplete="off"></textarea>
        </label>
      </section>
    </aside>

    <main class="workspace">
      <div class="stage" id="stage">
        <canvas id="c" aria-label="Meme canvas. Drag captions to move them."></canvas>
      </div>
      <div class="controls">
        <div class="presets" id="presets" role="tablist" aria-label="Layout presets"></div>
        <div class="sliders">
          <label class="slider">
            <span>Font size <em id="fontVal">48</em></span>
            <input id="fontSize" type="range" min="24" max="96" value="48" />
          </label>
          <label class="slider">
            <span>Outline <em id="outlineVal">6</em></span>
            <input id="outline" type="range" min="0" max="16" value="6" />
          </label>
        </div>
        <p class="hint">Drag captions on the image to reposition them.</p>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
